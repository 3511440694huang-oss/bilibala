<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<meta name="color-scheme" content="dark light">
<title>哔哩吧啦</title>
<script>
window.__E=[];
addEventListener('error',function(e){var er=e.error;if(er&&er.name==='RuntimeException')return;__E.push(String(e.message||e.error||''))});
addEventListener('unhandledrejection',function(e){var m=String((e.reason&&e.reason.message)||e.reason||'');if(m.indexOf('play() request was interrupted')>=0)return;__E.push('rej:'+m)});
</script>
<link rel="stylesheet" href="app.css">
</head>
<body data-route="channel">

<div class="ambient" aria-hidden="true"></div>
<a class="skip sr-only" href="#main">跳到内容</a>

<div class="boot" id="boot" aria-hidden="true">
  <span class="boot__mark"></span>
  <span class="boot__line"><i></i></span>
</div>

<header class="top" id="top">
  <button class="station" id="st-btn" type="button" aria-haspopup="dialog" aria-label="切换主播" aria-description="点击打开主播列表，左右滑动快速切换上一位或下一位主播">
    <span class="station__av" id="st-av"></span>
    <span class="station__txt">
      <b id="st-name">还没有主播</b>
      <i id="st-sub">点这里添加</i>
    </span>
    <span class="station__chev" id="st-chev"></span>
  </button>
  <div class="top__right">
    <span class="livedot" id="top-live" hidden><i></i>在播</span>
    <button class="icon-btn" id="btn-me" type="button" aria-label="我的">
      <span class="avatar avatar--sm" id="acct-av">我</span>
    </button>
  </div>
</header>

<main class="stage" id="main">
<!--VIEW:channel-->
<!--VIEW:live-->
<!--VIEW:playlist-->
<!--VIEW:monitor-->
<!--VIEW:me-->
</main>

<nav class="dock" id="dock" role="tablist" aria-label="主导航">
  <button class="dock__item" data-go="channel" role="tab" aria-selected="true" aria-label="频道"><span class="dock__ico" data-ico="broadcast"></span><span class="dock__lbl">频道</span></button>
  <button class="dock__item" data-go="live" role="tab" aria-selected="false" aria-label="直播"><span class="dock__ico" data-ico="live"></span><span class="dock__lbl">直播</span></button>
  <button class="dock__item" data-go="playlist" role="tab" aria-selected="false" aria-label="歌单"><span class="dock__ico" data-ico="music"></span><span class="dock__lbl">歌单</span></button>
  <button class="dock__item" data-go="monitor" role="tab" aria-selected="false" aria-label="监控"><span class="dock__ico" data-ico="grid"></span><span class="dock__lbl">监控</span></button>
</nav>

<div class="mini" id="mini" hidden>
  <div class="mini__stage" id="mini-stage"></div>
  <div class="mini__bar">
    <b class="mini__title truncate" id="mini-title">正在播放</b>
    <button class="mini__btn" id="mini-toggle" type="button" aria-label="暂停"></button>
    <button class="mini__btn" id="mini-close" type="button" aria-label="关掉小窗"></button>
  </div>
  <button class="mini__open" id="mini-open" type="button" aria-label="回到频道"></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-ttl" hidden>
  <div class="sheet__grip" id="sheet-grip"><i></i></div>
  <div class="sheet__head"><h2 class="h3" id="sheet-ttl">标题</h2><button class="icon-btn" id="sheet-x" type="button" aria-label="关闭"></button></div>
  <div class="sheet__body" id="sheet-body"></div>
  <div class="sheet__foot" id="sheet-foot"></div>
</div>

<script src="mpegts.js"></script>
<script src="qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
