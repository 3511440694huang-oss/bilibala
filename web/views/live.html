<section class="view" id="view-live" data-view="live" hidden>
  <div class="lv-page">
    <div class="lv-left">

      <div class="lv-stagewrap">
        <div class="lv-stage card" id="live-stage" data-state="loading">
          <video id="live-video" class="lv-video" playsinline muted preload="none" disablepictureinpicture poster="/assets/idle.webp"></video>
          <div class="lv-scrim" aria-hidden="true"></div>

          <div class="lv-top">
            <span class="lv-badge" id="live-badge" hidden>
              <i class="lv-dot" aria-hidden="true"></i>
              <span id="live-badgetxt">直播中</span>
            </span>
            <button class="icon-btn lv-fsbtn" id="live-fs" type="button" aria-label="全屏观看" hidden></button>
          </div>

          <div class="lv-veil" id="live-note">
            <span class="lv-spin" aria-hidden="true"></span>
            <p class="lv-note-t" id="live-note-t">正在连到直播间…</p>
            <button class="btn lv-note-btn" id="live-retry" type="button" hidden>重试</button>
          </div>

          <div class="lv-veil lv-veil--off" id="live-offline" hidden>
            <span class="lv-art lv-art--off" aria-hidden="true">
              <svg viewBox="0 0 64 64" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="25" y="11" width="14" height="24" rx="7"/>
                <path d="M18.5 30a13.5 13.5 0 0 0 27 0"/>
                <path d="M32 43.5V51"/>
                <path d="M24 54h16"/>
              </svg>
            </span>
            <div class="lv-offmsg">
              <p class="lv-off-t">这会儿没有开播</p>
              <p class="lv-off-s" id="live-off-s">主播不在直播间。节目带里存着每一次现场。</p>
              <button class="btn btn--primary lv-off-btn" id="live-go-channel" type="button">去看看节目带</button>
            </div>
          </div>
        </div>
      </div>

      <div class="lv-meta">
        <div class="lv-meta__main">
          <h2 class="h2 lv-title clamp-2" id="live-title">直播间</h2>
          <p class="lv-sub">
            <span class="lv-sub__name" id="live-uname">主播</span>
            <span class="lv-sep" aria-hidden="true"></span>
            <span class="num" id="live-online">人气统计中</span>
          </p>
        </div>
        <div class="lv-ctl" id="live-ctl">
          <button class="btn lv-qn" id="live-qn" type="button" aria-haspopup="listbox" disabled>原画</button>
          <button class="icon-btn lv-mute" id="live-mute" type="button" aria-pressed="true" aria-label="声音：已静音" disabled></button>
          <button class="icon-btn lv-refresh" id="live-refresh" type="button" aria-label="刷新直播流" disabled></button>
        </div>
      </div>

    </div>

    <section class="card lv-panel" id="live-panel" aria-label="实时弹幕" hidden>
      <header class="lv-phead">
        <span class="eyebrow">实时弹幕</span>
        <span class="lv-conn" id="live-conn" data-state="idle">
          <i class="lv-dot" aria-hidden="true"></i>
          <span id="live-conntxt">未连接</span>
        </span>
      </header>

      <div class="lv-feedwrap">
        <ul class="lv-feed" id="live-chat" role="log" aria-live="polite" aria-relevant="additions"></ul>
        <div class="lv-feedempty" id="live-chat-empty">
          <p class="lv-ghost">弹幕还没来。</p>
          <p class="lv-ghost">开播后这里会滚动直播间的实时消息。</p>
          <p class="lv-ghost">有想说的，先在下面打个招呼。</p>
        </div>
        <button class="btn lv-new" id="live-new" type="button" hidden>
          <span id="live-newtxt">有新弹幕</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="lv-loginbar" id="live-loginbar" hidden>
        <span class="lv-loginbar__t">发弹幕要先用 B 站账号登录。</span>
        <button class="btn" id="live-login" type="button">去登录</button>
      </div>

      <form class="lv-compose" id="live-form" novalidate>
        <button class="icon-btn lv-emobtn" id="live-emo-btn" type="button" aria-label="表情" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.25"/>
            <path d="M8.7 14.1a4.1 4.1 0 0 0 6.6 0"/>
            <path d="M9.4 9.7h.01"/><path d="M14.6 9.7h.01"/>
          </svg>
        </button>
        <label class="lv-inputwrap">
          <input class="lv-input" id="live-input" type="text" maxlength="20" autocomplete="off" enterkeyhint="send" aria-label="弹幕内容" placeholder="说点什么…">
        </label>
        <button class="btn btn--primary lv-send" id="live-send" type="submit" disabled>发送</button>
      </form>

      <div class="lv-emopane" id="live-emo" hidden>
        <div class="lv-emotabs" id="live-emotabs" role="tablist" aria-label="表情分类"></div>
        <div class="lv-emogrid" id="live-emogrid" role="group" aria-label="表情"></div>
        <div class="lv-emomsgwrap" id="live-emomsgwrap" hidden>
          <p class="lv-emomsg" id="live-emomsg"></p>
          <button class="btn lv-emoretry" id="live-emoretry" type="button" hidden>重试</button>
        </div>
        <div class="lv-emoprev" id="live-emoprev" hidden>
          <img class="lv-emoprev__img" id="live-emoimg" alt="" width="36" height="36">
          <span class="lv-emoprev__name truncate" id="live-emoname"></span>
          <button class="btn lv-emoprev__send" id="live-emosend" type="button">发送</button>
          <button class="icon-btn lv-emoprev__x" id="live-emocancel" type="button" aria-label="取消这个表情">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 6l12 12"/><path d="M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="lv-foot">弹幕来自直播间实时消息；发弹幕需先用 B 站账号扫码登录。</p>
    </section>
  </div>
</section>
