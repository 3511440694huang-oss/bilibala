<section class="view" id="view-channel" data-view="channel" hidden>
  <!-- ============================================================
       画面层级约定（#ch-media 是 isolation:isolate 的独立栈；新层别越过这些数）
         0  .ch-poster      海报（暗淡底）
         1  #player         video：画面本体，唯一进度真相
         2  .ch-vignette    顶部暗渐变
         3  #ch-hold        切清晰度时的「定格最后一帧」，挡住黑屏
         4  #dm-canvas      弹幕（20-danmaku / 21-dm-ui 维护）
         5  （手势层）      36-gesture.js 的透明层放这一档，单击/双击仍由播放内核在
                             document 捕获段处理，所以挡住也不影响播放交互
         6  #ch-idle        空闲 CTA
         7  #ch-shield      锁屏挡板：只有 .is-locked 时才出现，吞掉所有误触
         8  #ch-fs/#ch-lock 画面角标（44×44）
         9  提示 pill       loading / stall / boost / hint
       规则：video 不外包一层，弹幕在 video 之上、控件之下；角标一律 ≥44。
       ============================================================ -->
  <div class="ch">
    <div class="ch__main">
      <article class="ch-stage is-idle" id="ch-stage" aria-label="播放器">
        <div class="ch-media" id="ch-media" role="group" aria-label="播放画面：单击显隐控制，双击左右两侧快退快进，长按两倍速">
          <img class="ch-poster" id="ch-poster" alt="" hidden>
          <video id="player" playsinline preload="auto" muted disablepictureinpicture></video>
          <canvas class="ch-hold" id="ch-hold" aria-hidden="true" hidden></canvas>
          <canvas class="ch-dm" id="dm-canvas" aria-hidden="true"></canvas>
          <span class="ch-vignette" aria-hidden="true"></span>

          <div class="ch-idle" id="ch-idle">
            <span class="ch-mark" aria-hidden="true"><span data-ico="broadcast"></span></span>
            <p class="ch-idle__line" id="ch-idle-line">把 24 小时回放排成电台</p>
            <button class="btn ch-cta" id="ch-idle-play" type="button"><span data-ico="play"></span><span id="ch-idle-play-txt">开始收听</span></button>
          </div>

          <div class="ch-shield" id="ch-shield" aria-hidden="true" hidden></div>

          <button class="ch-lock" id="ch-lock" type="button" aria-label="锁定画面，防误触" aria-pressed="false" data-state="unlocked">
            <span class="ch-lockico ch-lockico--off" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="4.5" y="10.6" width="15" height="9.4" rx="3"/><path d="M8.2 10.6V8.2a3.8 3.8 0 0 1 7.2-1.3"/></svg></span>
            <span class="ch-lockico ch-lockico--on" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="4.5" y="10.6" width="15" height="9.4" rx="3"/><path d="M8.2 10.6V8a3.8 3.8 0 0 1 7.6 0v2.6"/></svg></span>
          </button>

          <button class="ch-fs icon-btn" id="ch-fs" type="button" aria-label="全屏播放"><span data-ico="expand"></span></button>

          <div class="ch-loading" id="ch-loading" hidden>
            <i aria-hidden="true"></i><span>正在取流</span>
          </div>
          <span class="ch-stall" id="ch-stall" role="status" hidden><i aria-hidden="true"></i><span id="ch-stall-txt">声音缓冲中</span></span>
          <span class="ch-boost" id="ch-boost" hidden><b>2×</b> 快进中</span>
          <span class="ch-hint" id="ch-hint" aria-hidden="true"></span>
        </div>

        <div class="ch-body">
          <p class="sr-only" id="ch-state" aria-live="polite">未播放</p>

          <div class="ch-head">
            <div class="ch-head__txt">
              <h1 class="ch-title" id="np-title">还没有在放</h1>
              <button class="ch-qnbtn" id="ch-qn" type="button" aria-haspopup="dialog" aria-label="清晰度 自动，点开切换" data-qn="0">自动</button>
              <p class="ch-meta truncate" id="ch-meta" hidden></p>
            </div>
            <div class="ch-ep" role="group" aria-label="选集">
              <button class="ch-tbtn ch-epbtn" id="ch-prev" type="button" aria-label="上一期">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18.6 5.6v12.8L9.2 12z" fill="currentColor" stroke="none"/><path d="M5.6 5.6v12.8"/></svg>
              </button>
              <button class="ch-tbtn ch-epbtn" id="ch-next" type="button" aria-label="下一期">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.4 5.6v12.8L14.8 12z" fill="currentColor" stroke="none"/><path d="M18.4 5.6v12.8"/></svg>
              </button>
            </div>
          </div>

          <div class="ch-prog">
            <span class="ch-time num" id="ch-elapsed">0:00</span>
            <div class="ch-track" id="ch-track" role="slider" tabindex="0" aria-label="播放进度"
                 aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
              <span class="ch-rail"><i class="ch-buf" id="ch-buf"></i><i class="ch-fill" id="ch-fill"></i></span>
              <i class="ch-knob" id="ch-knob"></i>
              <span class="ch-bubble num" id="ch-bubble" hidden>0:00</span>
            </div>
            <span class="ch-time num dim" id="ch-dur">--:--</span>
          </div>

          <div class="ch-transport" role="group" aria-label="播放控制">
            <div class="ch-tg">
              <button class="ch-tbtn" id="ch-back" type="button" aria-label="后退 10 秒"><span data-ico="back10"></span></button>
              <button class="ch-play" id="ch-toggle" type="button" aria-label="播放"><span data-ico="play"></span></button>
              <button class="ch-tbtn" id="ch-fwd" type="button" aria-label="前进 10 秒"><span data-ico="fwd10"></span></button>
            </div>
            <div class="ch-tg ch-tg--end">
              <button class="ch-tbtn" id="ch-dm" type="button" aria-label="弹幕" aria-pressed="true"><span data-ico="chat"></span></button>
              <button class="ch-tbtn ch-rate" id="ch-rate" type="button" aria-label="倍速、清晰度与定时"><span class="num" id="ch-rate-label">1×</span></button>
              <button class="ch-tbtn" id="ch-queue" type="button" aria-label="播放队列"><span data-ico="list"></span></button>
            </div>
          </div>
        </div>
      </article>
    </div>

    <section class="ch-band" aria-labelledby="ch-band-ttl">
      <header class="ch-band__head">
        <div class="ch-band__text">
          <p class="eyebrow">频道</p>
          <h2 class="h2" id="ch-band-ttl">节目带</h2>
          <p class="ch-band__sub dim">按分类翻，点一期就从这期的开头听</p>
        </div>
        <span class="ch-band__count num" id="ch-count"></span>
      </header>

      <div class="ch-filters" id="ch-filters" role="group" aria-label="按分类筛选"></div>

      <div class="ch-skel" id="ch-skel" hidden aria-hidden="true"></div>
      <ol class="ch-list" id="ch-list"></ol>

      <div class="ch-more" id="ch-more" hidden>
        <button class="btn" id="ch-more-btn" type="button">再看一批</button>
      </div>

      <div class="ch-empty" id="ch-empty" hidden>
        <span class="ch-empty__ico" aria-hidden="true" data-ico="broadcast"></span>
        <p class="ch-empty__ttl" id="ch-empty-ttl">节目带还没到</p>
        <p class="ch-empty__sub" id="ch-empty-sub">检查网络后重试一次</p>
        <button class="btn" id="ch-retry" type="button">重新加载</button>
      </div>
    </section>
  </div>
</section>
